<script type="text/javascript">
    (function () {
        "use strict";
        RED.nodes.registerType("lg-thinq-account", {
            category: "config",
            defaults: {
                name: { value: "" },
                country: { value: "IN" },
                clientId: { value: "" },
                pollSeconds: { value: 60, validate: RED.validators.number() },
                realtime: { value: true }
            },
            credentials: {
                pat: { type: "password" }
            },
            label: function () {
                return this.name || "LG ThinQ (" + (this.country || "IN") + ")";
            },
            oneditprepare: function () {
                if (!$("#node-config-input-clientId").val()) {
                    const id = (window.crypto && crypto.randomUUID)
                        ? crypto.randomUUID()
                        : "thinq-" + Math.random().toString(16).slice(2) + Date.now().toString(16);
                    $("#node-config-input-clientId").val(id);
                }
                const node = this;
                $("#lg-thinq-test").on("click", function () {
                    const $status = $("#lg-thinq-test-status");
                    $status.text("Testing…");
                    $.ajax({
                        url: "lg-thinq/devices",
                        method: "POST",
                        contentType: "application/json",
                        data: JSON.stringify({
                            id: node.id,
                            country: $("#node-config-input-country").val(),
                            clientId: $("#node-config-input-clientId").val(),
                            pat: $("#node-config-input-pat").val()
                        })
                    }).done(function (body) {
                        const devices = (body && body.devices) || [];
                        if (!devices.length) {
                            $status.text("Connected, but no devices on this account.");
                            return;
                        }
                        const lines = devices.map(function (d) {
                            return d.name + " — " + d.type.replace("DEVICE_", "");
                        });
                        $status.text("OK · " + devices.length + " device(s)\n" + lines.join("\n"));
                    }).fail(function (xhr) {
                        const err = (xhr.responseJSON && xhr.responseJSON.error) || xhr.statusText || "failed";
                        $status.text("Failed: " + err);
                    });
                });
            }
        });
    }());
</script>

<script type="text/markdown" data-help-name="lg-thinq-account">
LG ThinQ account

Shared login for every `lg-thinq-device` node. Uses LG's official ThinQ Connect API and a Personal Access Token.

### Setup

1. Open [connect-pat.lgthinq.com](https://connect-pat.lgthinq.com)
2. Sign in with the same account as the ThinQ app
3. Create a token with view, status, control, event, and push scopes
4. Paste it here, pick the account country, click **Test connection**

The token is stored in Node-RED credentials (`flows_cred.json`). Client ID is generated once and reused so LG does not throttle new MQTT clients.

### Poll vs realtime

Poll is a fallback heartbeat (default 60s). Realtime uses one AWS IoT MQTT session for the account and pushes cycle-complete / door / error events immediately.
